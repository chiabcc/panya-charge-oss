name: "Panya Charge OSS"
version: "0.2.3"
slug: panya_charge_oss
description: "OCPP 1.6-J EV charger bridge for Home Assistant. Connects any OCPP 1.6-J charger (target: ABB Terra AC) to HA via MQTT for smart charging with solar surplus optimization."
maintainer: "Chiab Code Code"
arch:
  - aarch64
  - amd64
url: https://github.com/chiabcc/panya-charge-oss
image: ghcr.io/chiabcc/{arch}-panya-charge-oss
startup: services
boot: auto
ports:
  "8887/tcp": 8887
ports_description:
  "8887/tcp": "OCPP WebSocket port. Chargers connect to ws://<HA-IP>:8887/{ws}"
host_network: false
homeassistant: true
ingress: true
ingress_port: 8888
services:
  - mqtt:need
options:
  base_topic: panya
  client_id: panya-charge
  log_level: info
  log_format: text
  min_amps: 6
  max_amps: 32
  default_amps: 6
  contactor_cooldown_sec: 180
  disconnect_threshold_sec: 60
  grid_entity_id: ""
  solar_entity_id: ""
  consumption_entity_id: ""
  mqtt_broker: ""
  mqtt_username: ""
  mqtt_password: ""
schema:
  base_topic: str
  client_id: str
  log_level: list(debug|info|warn|error)
  log_format: list(text|json)
  min_amps: int(6,32)
  max_amps: int(6,32)
  default_amps: int(6,32)
  contactor_cooldown_sec: int(30,600)
  disconnect_threshold_sec: int(10,300)
  grid_entity_id: "str?"
  solar_entity_id: "str?"
  consumption_entity_id: "str?"
  mqtt_broker: str?
  mqtt_username: str?
  mqtt_password: password?
