<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panya Charge — Login</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,-apple-system,sans-serif;background:#1a1a2e;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh}
        form{background:#16213e;padding:2rem;border-radius:8px;width:320px}
        h1{font-size:1.2rem;margin-bottom:1rem;text-align:center}
        label{display:block;font-size:.85rem;margin-bottom:.25rem;color:#aaa}
        input[type=password]{width:100%;padding:.5rem;border:1px solid #333;border-radius:4px;background:#0f3460;color:#eee;font-size:.9rem;margin-bottom:1rem}
        button{width:100%;padding:.6rem;background:#0f3460;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:.9rem}
        button:hover{background:#1a1a4e}
        .error{color:#e74c3c;font-size:.8rem;text-align:center;margin-bottom:.5rem}
    </style>
</head>
<body>
    <form id="login-form" hx-post="/login" hx-swap="outerHTML" hx-target="#login-form">
        <h1>Panya Charge</h1>
        {{ if .Error }}<div class="error">{{ .Error }}</div>{{ end }}
        <label for="token">Token</label>
        <input type="password" id="token" name="token" required autofocus autocomplete="current-password" placeholder="Enter access token">
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
